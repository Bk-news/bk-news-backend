<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BK.News</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BK.News">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D1013; --card:#171B20; --hair:#282E36;
    --text:#ECEEF0; --text-dim:#8B93A0;
    --gold:#D2A441; --gold-dim:#8A7130;
    --green:#5C8F63; --red:#C64B3C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:var(--ink);
    font-family:'Tajawal', sans-serif;
    color:var(--text);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{ padding:14px 20px 10px; }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-bottom:12px; }
  .brand .name{ font-weight:900; font-size:22px; }
  .brand .dot{ color:var(--gold); }
  .brand .sub{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--text-dim); letter-spacing:1px; }
  .status{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px; margin-bottom:10px;
  }
  .status .dot{ width:6px;height:6px;border-radius:50%; background:var(--green); }
  .status.offline .dot{ background:var(--red); }

  .chips{ display:flex; gap:8px; padding:2px 20px 4px; overflow-x:auto; }
  .chip{
    font-size:13px; font-weight:700; padding:7px 16px; border-radius:20px;
    white-space:nowrap; border:1px solid var(--hair); color:var(--text-dim);
    cursor:pointer;
  }
  .chip.active{ background:var(--gold); color:#241c04; border-color:var(--gold); }

  main{ padding:8px 16px 40px; max-width:600px; margin:0 auto; }
  .card{ background:var(--card); border:1px solid var(--hair); border-radius:16px; padding:14px; margin-bottom:12px; }
  .card.breaking{ border-color:var(--gold-dim); background:linear-gradient(180deg, #221c0f, var(--card) 40%); }
  .card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .tag{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:6px; font-family:'IBM Plex Mono', monospace; }
  .tag.saudi{ background:rgba(92,143,99,.18); color:var(--green); }
  .tag.mbs{ background:rgba(210,164,65,.15); color:var(--gold); }
  .tag.breaking{ background:rgba(198,75,60,.2); color:#e07a6b; }
  .tag.article{ background:rgba(139,147,160,.15); color:var(--text-dim); }
  .time{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); }
  .headline{ font-size:16.5px; font-weight:700; line-height:1.5; margin-bottom:6px; }
  .snippet{ font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:10px; }
  .card-bottom{ display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px dashed var(--hair); }
  .source{ font-size:12px; color:var(--text-dim); }
  .readmore{ font-size:12px; font-weight:700; color:var(--gold); text-decoration:none; }
  .empty{ text-align:center; color:var(--text-dim); padding:60px 20px; font-size:14px; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="name">BK<span class="dot">.</span>News</span>
      <span class="sub">SAUDI WIRE MONITOR</span>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">جاري الاتصال بالسيرفر…</span></div>
  </header>

  <div class="chips" id="chips">
    <div class="chip active" data-cat="">الكل</div>
    <div class="chip" data-cat="breaking">عاجل</div>
    <div class="chip" data-cat="saudi">السعودية</div>
    <div class="chip" data-cat="mbs">ولي العهد</div>
    <div class="chip" data-cat="article">مقالات</div>
  </div>

  <main id="feed">
    <div class="empty">جاري تحميل الأخبار…</div>
  </main>

<script>
let allArticles = [];
let activeCategory = "";

function timeAgo(iso){
  const mins = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/60000));
  if(mins < 1) return "الآن";
  if(mins === 1) return "قبل دقيقة";
  if(mins < 60) return "قبل " + mins + " د";
  const hrs = Math.floor(mins/60);
  return "قبل " + hrs + " س";
}

const tagLabel = {breaking:"عاجل", mbs:"ولي العهد", saudi:"السعودية", article:"مقال"};

function render(){
  const feed = document.getElementById('feed');
  const list = activeCategory ? allArticles.filter(a=>a.category===activeCategory) : allArticles;
  if(list.length === 0){
    feed.innerHTML = '<div class="empty">ما فيه أخبار بهذا التصنيف حاليًا</div>';
    return;
  }
  feed.innerHTML = list.map(a => `
    <div class="card ${a.category==='breaking' ? 'breaking':''}">
      <div class="card-top">
        <span class="tag ${a.category}">${tagLabel[a.category]||a.category}</span>
        <span class="time">${timeAgo(a.publishedAt)}</span>
      </div>
      <div class="headline">${a.headline}</div>
      <div class="snippet">${a.snippet||''}</div>
      <div class="card-bottom">
        <span class="source">${a.sourceName}</span>
        <a class="readmore" href="${a.sourceURL}" target="_blank" rel="noopener">اقرأ المصدر ←</a>
      </div>
    </div>
  `).join('');
}

async function fetchFeed(){
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  try{
    const res = await fetch('/v1/feed', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    allArticles = await res.json();
    statusEl.classList.remove('offline');
    statusText.textContent = 'متصل — آخر تحديث ' + new Date().toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
    render();
  }catch(err){
    statusEl.classList.add('offline');
    statusText.textContent = 'تعذر الاتصال بالسيرفر — تأكد إنه شغّال وإنك على نفس الشبكة';
  }
}

document.getElementById('chips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeCategory = chip.dataset.cat;
  render();
});

fetchFeed();
setInterval(fetchFeed, 60000);
</script>
</body>
</html>
