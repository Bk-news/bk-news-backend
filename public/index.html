<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BK.News</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BK.News">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0C10;
    --void-2:#12151B;
    --panel:#171B22;
    --line:#262B34;
    --paper:#F5F1E8;
    --dim:#8D95A3;
    --ember:#FF4B3E;
    --ember-dim:#3A1712;
    --brass:#E8B04B;
    --brass-dim:#332708;
    --emerald:#34C08A;
    --emerald-dim:#0E2C22;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(255,75,62,.10), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(232,176,75,.08), transparent 55%),
      var(--void);
    font-family:'Tajawal', sans-serif;
    color:var(--paper);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100%;
  }
  main{ max-width:600px; margin:0 auto; padding-bottom:50px; }

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px 6px;
  }
  .brand{ display:flex; align-items:baseline; gap:6px; }
  .brand .name{ font-family:'Cairo',sans-serif; font-weight:900; font-size:21px; letter-spacing:.2px; }
  .brand .dot{ color:var(--ember); }
  .liveping{
    display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dim);
  }
  .liveping i{
    width:7px; height:7px; border-radius:50%; background:var(--emerald);
    box-shadow:0 0 0 0 rgba(52,192,138,.6);
    animation:livepulse 2s infinite;
  }
  .liveping.offline i{ background:var(--ember); animation:none; }
  @keyframes livepulse{
    0%{ box-shadow:0 0 0 0 rgba(52,192,138,.55); }
    70%{ box-shadow:0 0 0 8px rgba(52,192,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(52,192,138,0); }
  }

  .hero{
    position:relative;
    margin:14px 16px 6px;
    padding:20px 18px 18px;
    border-radius:20px;
    overflow:hidden;
    background:linear-gradient(155deg, var(--ember-dim), var(--void-2) 65%);
    border:1px solid rgba(255,75,62,.25);
    display:none;
  }
  .hero.show{ display:block; }
  .hero-rings{
    position:absolute; top:18px; inset-inline-end:18px; width:34px; height:34px;
  }
  .hero-rings span{
    position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--ember);
    animation:ringout 2.4s ease-out infinite;
    opacity:0;
  }
  .hero-rings span:nth-child(2){ animation-delay:.8s; }
  .hero-rings span:nth-child(3){ animation-delay:1.6s; }
  @keyframes ringout{
    0%{ transform:scale(.3); opacity:.9; }
    100%{ transform:scale(1.6); opacity:0; }
  }
  .hero-rings::after{
    content:''; position:absolute; inset:11px; border-radius:50%; background:var(--ember);
  }
  .hero-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    color:var(--ember); letter-spacing:1px; margin-bottom:10px;
  }
  .hero-headline{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:21px; line-height:1.45;
    margin-bottom:10px; max-width:88%;
  }
  .hero-snippet{ font-size:13.5px; color:var(--dim); line-height:1.7; margin-bottom:14px; max-width:92%; }
  .hero-bottom{ display:flex; justify-content:space-between; align-items:center; }
  .hero-source{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); }
  .hero-link{ font-size:12.5px; font-weight:700; color:var(--ember); text-decoration:none; }

  .ticker{
    margin:16px 16px 4px; padding:9px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    overflow:hidden; white-space:nowrap;
  }
  .ticker span{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim);
    display:inline-block; padding-inline-end:50px;
    animation:tickmove 28s linear infinite;
  }
  @keyframes tickmove{ 0%{ transform:translateX(100%);} 100%{ transform:translateX(-100%);} }

  .rail{ display:flex; gap:8px; padding:16px 16px 6px; overflow-x:auto; }
  .rail::-webkit-scrollbar{ display:none; }
  .pill{
    font-size:13px; font-weight:700; padding:8px 16px; border-radius:10px;
    white-space:nowrap; border:1px solid var(--line); color:var(--dim);
    font-family:'Tajawal',sans-serif;
  }
  .pill.active{ background:var(--paper); color:var(--void); border-color:var(--paper); }

  .feed{ padding:8px 16px 0; }
  .row{
    display:flex; gap:12px; align-items:flex-start;
    padding:16px 0; border-bottom:1px solid var(--line);
  }
  .row .bar{ width:3px; align-self:stretch; border-radius:3px; flex-shrink:0; margin-top:3px; }
  .row .bar.breaking{ background:var(--ember); }
  .row .bar.mbs{ background:var(--brass); }
  .row .bar.saudi{ background:var(--emerald); }
  .row .bar.article{ background:var(--dim); }
  .row-body{ flex:1; min-width:0; }
  .row-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px; }
  .label{ font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.5px; }
  .label.breaking{ color:var(--ember); }
  .label.mbs{ color:var(--brass); }
  .label.saudi{ color:var(--emerald); }
  .label.article{ color:var(--dim); }
  .row-time{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dim); flex-shrink:0; }
  .row-headline{ font-family:'Cairo',sans-serif; font-weight:700; font-size:15.5px; line-height:1.55; margin-bottom:5px; }
  .row-snippet{ font-size:12.5px; color:var(--dim); line-height:1.6; margin-bottom:8px; }
  .row-bottom{ display:flex; justify-content:space-between; align-items:center; }
  .row-source{ font-size:11.5px; color:var(--dim); }
  .row-link{ font-size:11.5px; font-weight:700; color:var(--paper); text-decoration:none; opacity:.85; }

  .empty{ text-align:center; color:var(--dim); padding:70px 20px; font-size:13.5px; font-family:'IBM Plex Mono',monospace; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="brand"><span class="name">BK<span class="dot">.</span>News</span></div>
    <div class="liveping" id="live"><i></i><span id="live-text">اتصال…</span></div>
  </div>

  <div class="hero" id="hero"></div>

  <div class="ticker"><span id="ticker-text">جاري تحميل المستجدات…</span></div>

  <div class="rail" id="rail">
    <div class="pill active" data-cat="">الكل</div>
    <div class="pill" data-cat="breaking">عاجل</div>
    <div class="pill" data-cat="saudi">سياسة واقتصاد</div>
    <div class="pill" data-cat="mbs">ولي العهد</div>
    <div class="pill" data-cat="article">مقالات</div>
  </div>

  <div class="feed" id="feed">
    <div class="empty">جاري التحميل…</div>
  </div>
</main>

<script>
let all = [];
let activeCat = "";
const label = {breaking:"عاجل", mbs:"ولي العهد", saudi:"سياسة واقتصاد", article:"مقال"};

function timeAgo(iso){
  const m = Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/60000));
  if(m < 1) return "الآن";
  if(m === 1) return "قبل دقيقة";
  if(m < 60) return "قبل "+m+" د";
  return "قبل "+Math.floor(m/60)+" س";
}

function renderHero(){
  const hero = document.getElementById('hero');
  const top = all.find(a => a.category === 'breaking');
  if(!top){ hero.classList.remove('show'); hero.innerHTML=''; return; }
  hero.classList.add('show');
  hero.innerHTML = `
    <div class="hero-rings"><span></span><span></span><span></span></div>
    <div class="hero-eyebrow">عاجل الآن</div>
    <div class="hero-headline">${top.headline}</div>
    <div class="hero-snippet">${top.snippet||''}</div>
    <div class="hero-bottom">
      <span class="hero-source">${top.sourceName} · ${timeAgo(top.publishedAt)}</span>
      <a class="hero-link" href="${top.sourceURL}" target="_blank" rel="noopener">اقرأ المصدر ←</a>
    </div>`;
}

function renderTicker(){
